# Paper-v1 Pillar I - Kimi K3 anchored OncoTree atlas, matched n=5 layer
#
# Derived from configs/paper_v1_pillar1_anchored_atlas_tranche1_n5.yaml by
# narrowing the locked cheap-model pair to Kimi K3 only. The 148-code roster,
# v4 neutralized prompt, deterministic enum shuffle, diagnosis date, study
# knowledge cutoff, accepted-target policy, and terminal contract are
# intentionally unchanged.
#
# Matrix in accepted-target mode:
#   148 primary cells x 1 Kimi K3 model x 5 accepted/cell
#   = 740 accepted target trajectories, cap 24/cell.
#
# Kimi K3 is routed through OpenRouter with the provider policy in
# synthonccases.generate.providers. At commit 8e7016b, bare moonshotai/kimi-k3
# sends reasoning={effort: none}; live smoke runs confirmed reasoning_tokens=0.
schema_version: 1
config_id: paper_v1_pillar1_anchored_atlas_kimi_k3_n5_neutralized_enum_shuffle
study_reference:
  diagnosis_date: '2024-01-15'
  knowledge_cutoff: '2024-12-31'
run_defaults:
  cells_count: 148
  accepted_futures_per_cell: 5
  max_total_futures_per_cell: 24
  max_attempts: 3
  terminal_contract: death_only
prompt:
  template_path: prompts/oncollm_v1/experimental_lean_ledger_v2_rich_neutralized.md
  enum_order:
    mode: deterministic_shuffle
    seed: paper_v1_pillar1_anchored_atlas_neutralized_enum_shuffle_v1
provider:
