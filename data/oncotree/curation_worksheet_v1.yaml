schema_version: oncotree_curation_worksheet_v1
source_roster: data/oncotree/roster_v1.yaml
source_roster_oncotree_version: oncotree_2025_10_03
total_nodes: 897
tier_definitions:
  primary: Clinically meaningful entities for headline atlas analysis. Suitable for
    cross-cancer comparisons, anchor-sensitivity experiments, and counterfactual probes.
  secondary: "Valid but rare, redundant, ultra-specific, or taxonomy-heavy labels.\
    \ Included in stress / sensitivity analyses only \u2014 not in headline tables."
  excluded: Grouping nodes, benign/premalignant-only, pediatric-only unless intentional,
    outside adult oncology scope, or no distinct management signal from parent.
exclusion_reason_categories:
- non_clinical_grouping_node
- pediatric_only_unless_intentional
- premalignant_or_in_situ_only_without_invasive_analogue
- no_clinical_management_distinction_from_parent
- outside_adult_oncology_scope
secondary_role_definitions:
  targeted_stress: 'Definitely sampled in the stress / sensitivity panel. Distinct
    biology, actionable rare entity, or specifically informative for the rare-cancer
    story. Examples: malignant phyllodes, breast angiosarcoma, NUT carcinoma of the
    lung.'
  pool: "Valid rare entity, eligible for stratified random sampling from the secondary\
    \ panel. Not guaranteed to be sampled \u2014 drawn against a per-stratum budget.\
    \ Examples: rare metaplastic breast variants, rare large-cell lung variants."
  rollup_only: 'Useful taxonomy umbrella; pooled-level claims roll up from leaf tier
    results. NOT sampled directly. Examples: NSCLC, BRCA (invasive breast carcinoma
    umbrella), LNET (lung neuroendocrine umbrella).'
  catalog_only: Documented but probably not generated in paper 1. Ultra-rare or clinically
    unstable labels where a synthetic trajectory would be redundant or unreliable.
    Sits in the repo for completeness.
instructions: "Per-node review. Fill the `tier` column with 'primary', 'secondary',\
  \ or 'excluded'. When tier is 'excluded', fill `exclusion_reason` from the categories\
  \ above. When tier is 'secondary', fill `secondary_role` from {targeted_stress,\
  \ pool, rollup_only, catalog_only}. Use `notes` for free-text rationale. `suggested_tier`\
  \ / `suggested_exclusion_reason` are mechanical pre-fills \u2014 feel free to override.\
  \ Group order is by main_type; within each group, nodes are sorted by level then\
  \ code. CONVENTION: `tier=primary` is leaf-only by default. Non-leaf nodes that\
  \ are clinically canonical headline entities (e.g. CCRCC, DLBCLNOS, FL, MCL, CML,\
  \ HL) may be marked `primary` *only* by filling `primary_non_leaf_rationale` with\
  \ a non-empty string explaining the exception. The adapter rejects primary-on-non-leaf\
  \ without a rationale and rejects a rationale on any non-primary node. Only secondary_role\
  \ in {targeted_stress, pool} is generation-eligible; rollup_only and catalog_only\
  \ are documented but not sampled. See data/oncotree/curation_worksheet_README.md."
