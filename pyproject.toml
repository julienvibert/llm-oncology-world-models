[project]
name = "synthonccases"
version = "0.1.0"
description = "Mapping and calibrating native oncology priors in leading LLMs"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
dependencies = [
    "anthropic>=0.40",
    "openai>=1.50",
    "google-generativeai>=0.8",
    "jsonschema>=4.20",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "typer>=0.12",
    "rich>=13.0",
    "matplotlib>=3.10.8",
    "pydantic>=2.12",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "umap-learn>=0.5.12",
    "streamlit>=1.57.0",
    "lifelines>=0.30.3",
    "phate>=2.0.0",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Add repo root to sys.path so test modules can import from `tests.fixtures.*`
# regardless of invocation directory. Without this, pytest's implicit rootdir
# behaviour silently differs across environments and fails when only a single
# test file is collected.
pythonpath = ["."]

[dependency-groups]
dev = [
    "cairosvg>=2.9.1",
    "pre-commit>=4.5.1",
    "pytest>=8.0",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "ruff>=0.4",
]

# NOTE: After first `uv sync`, a uv.lock file is created.
# This lockfile pins EVERY dependency to an exact version.
# Always commit uv.lock to git for reproducibility.
# See docs/reproducibility.md for details.
